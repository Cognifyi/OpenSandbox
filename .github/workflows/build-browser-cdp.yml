name: Build Browser CDP Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'
      push_to_ghcr:
        description: 'Push to GitHub Container Registry'
        required: true
        type: boolean
        default: true
      push_to_dockerhub:
        description: 'Push to DockerHub'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push_to_ghcr == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: inputs.push_to_dockerhub == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Build base image
        run: |
          cd sandboxes/browser-cdp
          export TAG=${{ inputs.image_tag }}
          docker build -f Dockerfile_base -t opensandbox/browser-cdp-base:${TAG} .

      - name: Build final image
        run: |
          cd sandboxes/browser-cdp
          export TAG=${{ inputs.image_tag }}
          chmod +x build.sh
          ./build.sh

      - name: Push to GHCR
        if: inputs.push_to_ghcr == true
        run: |
          TAG=${{ inputs.image_tag }}
          docker tag opensandbox/browser-cdp-base:${TAG} ghcr.io/${{ github.repository }}/browser-cdp-base:${TAG}
          docker tag opensandbox/browser-cdp:${TAG} ghcr.io/${{ github.repository }}/browser-cdp:${TAG}
          docker push ghcr.io/${{ github.repository }}/browser-cdp-base:${TAG}
          docker push ghcr.io/${{ github.repository }}/browser-cdp:${TAG}

      - name: Push to DockerHub
        if: inputs.push_to_dockerhub == true
        run: |
          TAG=${{ inputs.image_tag }}
          docker push opensandbox/browser-cdp-base:${TAG}
          docker push opensandbox/browser-cdp:${TAG}
